name: CI checks

# Vérifie une Pull Request et chaque changement fusionné dans main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-lint: 
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      
  frontend-checks:
    # Ubuntu
    runs-on: ubuntu-latest

    # Toutes les commandes suivantes sont lancées dans le dossier frontend.
    defaults:
      run:
        working-directory: frontend

    steps:
      # Télécharge le contenu du dépôt sur la machine temporaire.
      - name: Récupérer le projet
        uses: actions/checkout@v4

      # Installe Node.js pour pouvoir utiliser npm et Vite.
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installe exactement les versions du fichier package-lock.json.
      - name: Installer les dépendances
        run: npm ci

      # Vérifie que le code respecte la règle de formatage Prettier.
      - name: Vérifier le formatage
        run: npm run format:check

      # Cherche les erreurs et mauvaises pratiques détectables par Oxlint.
      - name: Vérifier le lint
        run: npm run lint

      # Vérifie TypeScript puis prépare la version de production avec Vite.
      - name: Construire le frontend
        run: npm run build