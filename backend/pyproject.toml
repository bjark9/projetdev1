[tool.ruff]
line-length = 120
exclude = ["**/migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]   # erreurs, pyflakes, imports, bugbear, modernisation, Django

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "mysite.settings-example"